<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3E67F0">
<meta name="description" content="Wiggle Box: 28 touchscreen games for curious kids, with real physics and live formulas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wiggle Box">
<title>Wiggle Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="css/app.css">

<div id="home" class="view">
  <div class="home-in">
    <div class="hbar">
      <h1 class="logo" aria-label="Wiggle Box">
        <span style="--t:-4deg">W</span><span style="--t:3deg;animation-delay:.1s">i</span><span style="--t:-3deg;animation-delay:.2s">g</span><span style="--t:4deg;animation-delay:.3s">g</span><span style="--t:-2deg;animation-delay:.4s">l</span><span style="--t:3deg;animation-delay:.5s">e</span><span class="sp"></span><span style="--t:-4deg;animation-delay:.6s">B</span><span style="--t:3deg;animation-delay:.7s">o</span><span style="--t:-3deg;animation-delay:.8s">x</span>
      </h1>
      <div class="hud">
        <button class="pill btn" id="snd" aria-pressed="true">🔊 Sound on</button>
        <div class="pill" aria-label="Stars earned">⭐ <span class="starn">0</span></div>
      </div>
    </div>
    <nav class="jumps" id="jump" aria-label="Sections"></nav>
    <div id="sections"></div>
  </div>
</div>

<div id="game" class="view" hidden>
  <div class="gbar">
    <button class="back" id="back" aria-label="Back to games">←</button>
    <h2 class="gtitle" id="gtitle"></h2>
    <button class="back snd2" id="snd2" aria-pressed="true" aria-label="Sound on">🔊</button>
    <div class="pill" aria-label="Stars earned">⭐ <span class="starn">0</span></div>
  </div>
  <div class="stage" id="stage"></div>
</div>
<canvas id="fx"></canvas>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="games/atoms.js"></script>
<script src="games/balance.js"></script>
<script src="games/bridge.js"></script>
<script src="games/cannon.js"></script>
<script src="games/chance.js"></script>
<script src="games/circuit.js"></script>
<script src="games/bubbles.js"></script>
<script src="games/paint.js"></script>
<script src="games/feed.js"></script>
<script src="games/shapes.js"></script>
<script src="games/music.js"></script>
<script src="games/words.js"></script>
<script src="games/fireworks.js"></script>
<script src="games/forge.js"></script>
<script src="games/potion.js"></script>
<script src="games/geo.js"></script>
<script src="games/graph.js"></script>
<script src="games/art.js"></script>
<script src="games/laser.js"></script>
<script src="games/physics.js"></script>
<script src="games/primes.js"></script>
<script src="games/puzzles.js"></script>
<script src="games/robo.js"></script>
<script src="games/sand.js"></script>
<script src="games/space.js"></script>
<script src="games/splash.js"></script>
<script src="games/trace.js"></script>
<script src="games/waves.js"></script>
<script src="js/app.js"></script>
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</html>
