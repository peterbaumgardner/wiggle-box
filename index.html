<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3E67F0">
<meta name="description" content="Wiggle Box: 28 touchscreen games for curious kids, with real physics and live formulas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wiggle Box">
<title>Wiggle Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: one-screen toy chest. Home = chunky toy tiles; each game = full-screen stage with a top bar. */
:root{
  --sky:#3E67F0; --sky-deep:#2C4FCC; --ink:#1D1842; --paper:#FFFFFF; --cloud:#EEF2FF;
  --sun:#FFC83D; --berry:#FF4F7B; --leaf:#24C786; --grape:#9A5BFF; --tang:#FF8A2B; --aqua:#18BFD6;
  --font-display:'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --font-math:'STIX Two Text','Cambria Math',Cambria,'Times New Roman',serif;
  --r:28px; --edge:4px solid var(--ink); --lift:0 8px 0 var(--ink);
  color-scheme:light;
}
html,body{height:100%}
html{overflow:hidden}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(rgba(255,255,255,.13) 2.5px,transparent 3px);background-size:34px 34px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view[hidden]{display:none!important}

/* ---------- home ---------- */
#home{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.home-in{width:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,8vw,88px);line-height:.9;margin:0;display:flex;gap:.02em;color:var(--paper);
  text-shadow:0 5px 0 var(--ink)}
.logo span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:bob 2.6s ease-in-out infinite}
.logo .sp{width:.25em}
@keyframes bob{50%{transform:translateY(-6px) rotate(var(--t,0deg))}}
.hud{display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;background:var(--paper);border:var(--edge);border-radius:999px;padding:6px 16px;
  font-family:var(--font-display);font-weight:800;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.pill.btn{font-size:18px}
.pill.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.starn{font-variant-numeric:tabular-nums}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35) rotate(-8deg)}}
.sec{display:flex;flex-direction:column;gap:14px}
#sections{display:flex;flex-direction:column;gap:30px}
.sec-h{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.sec-h h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4vw,40px);color:var(--paper);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);line-height:1}
.sec-h p{margin:0;color:var(--paper);font-weight:900;font-size:clamp(15px,2vw,19px)}
.sec-lab{background:var(--ink);border-radius:36px;padding:20px;box-shadow:0 10px 0 rgba(29,24,66,.35);
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
.sec-lab .sec-h h2{color:var(--sun);-webkit-text-stroke:0;text-shadow:none}
.grid-lab .tile{min-height:clamp(190px,26vw,270px);border-color:var(--paper);box-shadow:0 8px 0 rgba(255,255,255,.85)}
.grid-lab .tile:active{box-shadow:0 2px 0 rgba(255,255,255,.85)}
.grid-lab .tile .ico{font-size:clamp(56px,7.5vw,90px)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.2vw,24px)}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;border:var(--edge);border-radius:var(--r);box-shadow:var(--lift);background:var(--c);
  padding:18px 18px 20px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:clamp(170px,24vw,240px);
  transition:transform .1s,box-shadow .1s;overflow:hidden}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.tile .ico{font-size:clamp(54px,8vw,84px);line-height:1;margin-bottom:auto;filter:drop-shadow(0 4px 0 rgba(29,24,66,.25))}
.tile h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3vw,34px);line-height:1}
.tile p{margin:0;font-weight:700;font-size:clamp(14px,1.6vw,17px)}
.age{position:absolute;z-index:2;top:14px;right:14px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:2px 10px;font-weight:900;font-size:14px;letter-spacing:.03em}
.tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.22)}

/* ---------- game shell ---------- */
.gbar{display:flex;align-items:center;gap:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px}
.back{width:64px;height:64px;border-radius:50%;border:var(--edge);background:var(--paper);box-shadow:0 5px 0 var(--ink);
  font-size:34px;font-weight:900;display:grid;place-items:center;flex:none}
.back:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.gtitle{flex:1;margin:0;font-family:var(--font-display);font-weight:800;color:var(--paper);font-size:clamp(26px,4vw,40px);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{position:relative;flex:1;min-height:0;margin:0 max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));
  background:var(--cloud);border:var(--edge);border-radius:var(--r);overflow:hidden;touch-action:none}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 18px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--ink)}
.chip.on{background:var(--sun)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chips.float{position:absolute;top:12px;left:0;right:0;z-index:5;pointer-events:none}
.chips.float .chip{pointer-events:auto}

#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.floaty{position:absolute;z-index:6;pointer-events:none;font-family:var(--font-display);font-weight:800;color:var(--ink);
  font-size:clamp(24px,5vw,52px);white-space:normal;width:max-content;text-align:center;line-height:1.1;transform:translate(-50%,-50%);animation:rise 1.6s ease-out forwards;
  background:var(--paper);border:var(--edge);border-radius:20px;padding:2px 18px;box-shadow:0 5px 0 var(--ink)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* ---------- bubbles ---------- */
.bubble{position:absolute;left:0;top:0;border-radius:50%;border:3px solid rgba(255,255,255,.85);padding:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,transparent 10%),radial-gradient(circle at 50% 55%,hsla(var(--h),95%,72%,.55),hsla(var(--h),90%,55%,.9));
  box-shadow:inset -8px -10px 18px hsla(var(--h),80%,35%,.35),0 6px 14px rgba(29,24,66,.18);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:var(--ink);will-change:transform}
.bubble span{font-size:calc(var(--s) * .46);line-height:1}

/* ---------- paint ---------- */
.paint{position:absolute;inset:0;display:flex;flex-direction:column}
.paint canvas{flex:1;min-height:0;width:100%;display:block;background:var(--paper);touch-action:none}
.tools{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--paper);border-top:var(--edge);overflow-x:auto;flex:none}
.sw{flex:none;width:52px;height:52px;border-radius:50%;border:4px solid var(--ink);background:var(--c);padding:0}
.sw.on{box-shadow:0 0 0 4px var(--paper),0 0 0 8px var(--ink);transform:scale(1.05)}
.sw.eraser{font-size:26px;line-height:1;display:grid;place-items:center}
.sw.rainbow{background:conic-gradient(#ff4f5e,#ffc83d,#24c786,#18bfd6,#3d7bff,#9a5bff,#ff4f7b,#ff4f5e)}
.sep{flex:none;width:3px;height:40px;background:var(--ink);border-radius:2px;opacity:.25}
.tb{flex:none;height:52px;min-width:52px;border-radius:16px;border:3px solid var(--ink);background:var(--cloud);font-size:26px;
  display:grid;place-items:center;padding:0 10px;font-weight:900}
.tb.on{background:var(--sun)}
.dot{display:block;border-radius:50%;background:var(--ink)}

/* ---------- monster ---------- */
.feed,.shapes,.words,.music{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
.ask{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.5vw,46px);background:var(--paper);border:var(--edge);
  border-radius:24px;padding:4px 24px;box-shadow:0 5px 0 var(--ink);text-align:center;line-height:1.2}
.ask b{color:var(--berry);font-size:1.2em}
.monwrap{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.monster{position:relative;height:min(100%,320px);aspect-ratio:1;max-width:100%}
.mbody{position:absolute;inset:12% 6% 0;background:var(--grape);border:5px solid var(--ink);border-radius:46% 46% 40% 40%;box-shadow:inset -16px -18px 0 rgba(29,24,66,.18)}
.horn{position:absolute;top:2%;width:16%;height:22%;background:var(--sun);border:5px solid var(--ink);border-radius:50% 50% 20% 20%}
.horn.l{left:20%;transform:rotate(-18deg)}.horn.r{right:20%;transform:rotate(18deg)}
.eye{position:absolute;top:24%;width:22%;aspect-ratio:1;background:var(--paper);border:5px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.eye.l{left:24%}.eye.r{right:24%}
.pupil{width:44%;aspect-ratio:1;background:var(--ink);border-radius:50%;transition:transform .08s}
.mouth{position:absolute;left:28%;right:28%;top:56%;height:10%;background:#3A0F2E;border:5px solid var(--ink);border-radius:20px 20px 60px 60px;
  overflow:hidden;transition:height .15s}
.monster.hungry .mouth{height:26%}
.monster.chomp .mouth{animation:chomp .35s}
@keyframes chomp{0%{height:28%}50%{height:4%}100%{height:10%}}
.tongue{position:absolute;bottom:-20%;left:25%;right:25%;height:60%;background:var(--berry);border-radius:50%}
.teeth{position:absolute;top:0;left:10%;right:10%;height:10px;background:repeating-linear-gradient(90deg,#fff 0 14px,transparent 14px 20px)}
.monster.happy .mbody{animation:wig .6s 2}
@keyframes wig{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots i{width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dots i.f{background:var(--leaf);animation:bump .4s}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--paper);border:var(--edge);border-radius:24px;padding:8px 12px;max-width:100%}
.food{font-size:clamp(46px,7vw,64px);line-height:1;width:1.25em;height:1.25em;display:grid;place-items:center;touch-action:none;position:relative}
.dragging{z-index:50;transition:none!important;filter:drop-shadow(0 10px 6px rgba(29,24,66,.3))}
.return{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

/* ---------- shapes ---------- */
.holes{display:flex;gap:clamp(10px,3vw,30px);justify-content:center;flex-wrap:wrap;background:var(--paper);border:var(--edge);border-radius:24px;padding:16px;width:100%}
.hole,.piece{width:clamp(80px,14vw,140px);aspect-ratio:1;position:relative}
.hole svg,.piece svg{width:100%;height:100%;display:block;overflow:visible}
.hole svg *{fill:rgba(29,24,66,.1);stroke:var(--ink);stroke-width:4;stroke-dasharray:9 7;stroke-linejoin:round}
.piece svg *{stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.hole .piece{position:absolute;inset:0;width:100%;pointer-events:none;animation:bump .4s}
.hole .piece .rot{transform:none!important}
.rot{transition:transform .2s}
.pile{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:clamp(16px,4vw,44px);justify-content:center;align-content:center;width:100%}
.piece{touch-action:none}
.hint{font-weight:900;font-size:18px;margin:0;color:var(--ink);opacity:.7}

/* ---------- music ---------- */
.pads{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(6px,1.2vw,14px)}
@media (max-width:700px){.pads{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pad{border:var(--edge);border-radius:22px;background:var(--c);box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;padding-bottom:12px;font-family:var(--font-display);font-weight:800;touch-action:none;position:relative;transition:transform .08s,box-shadow .08s,filter .08s}
.pad b{font-size:clamp(26px,4vw,42px);line-height:1}
.pad small{font-size:clamp(14px,1.8vw,18px);font-weight:800;opacity:.8}
.pad.lit{transform:translateY(6px);box-shadow:0 2px 0 var(--ink);filter:brightness(1.25) saturate(1.2)}
.pad.next::before{content:"";position:absolute;inset:-10px;border:5px dashed var(--ink);border-radius:28px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04);opacity:.5}}
.msg{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.4vw,34px);text-align:center;min-height:1.3em;margin:0}

/* ---------- words ---------- */
.pic{font-size:clamp(90px,16vh,160px);line-height:1.1;background:var(--paper);border:var(--edge);border-radius:32px;padding:6px 26px;box-shadow:0 6px 0 var(--ink);border-style:solid}
.pic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.slots{display:flex;gap:10px}
.slot{width:clamp(62px,10vw,96px);aspect-ratio:1;border:4px dashed var(--ink);border-radius:18px;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:clamp(40px,6.5vw,64px);background:rgba(255,255,255,.6);text-transform:uppercase}
.slot.fill{border-style:solid;background:var(--sun);animation:bump .35s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:auto;padding-bottom:6px}
.lt{width:clamp(66px,10vw,96px);aspect-ratio:1;border:var(--edge);border-radius:20px;background:var(--c);box-shadow:0 6px 0 var(--ink);
  font-family:var(--font-display);font-weight:800;font-size:clamp(40px,6vw,60px);text-transform:uppercase;display:grid;place-items:center;padding:0}
.lt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.lt.used{visibility:hidden}
.lt.glow{animation:pulse .8s infinite;outline:5px dashed var(--ink);outline-offset:5px}

@media (prefers-reduced-motion:reduce){
  .logo span,.pad.next::before,.lt.glow{animation:none}
}

/* ---------- simulation shell (lab games) ---------- */
.simwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.simarea{position:relative;flex:1;min-height:0}
.simcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.simhint{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:4;
  background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 16px;font-weight:900;font-size:clamp(15px,2vw,20px);box-shadow:0 4px 0 var(--ink);text-align:center;max-width:min(90%,620px)}
.simhint.show{opacity:1;transform:translate(-50%,0)}
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--paper);border-top:var(--edge)}
.drow{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;min-height:44px}
.drow::-webkit-scrollbar{display:none}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:66px;padding:5px 8px 6px;border:3px solid var(--ink);border-radius:18px;background:var(--cloud);font-weight:900;font-size:13px;line-height:1.1}
.tool .ti{font-size:28px;line-height:1.1}
.tool.on{background:var(--sun);box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.tool:active{transform:translateY(2px)}
.tool.scene{background:var(--paper);border-style:dashed}
.opt{flex:none;display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 14px 4px 6px;font-weight:900;font-size:15px;min-height:42px;text-transform:capitalize}
.opt.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.oe{font-size:26px;line-height:1}
.odot{width:28px;height:28px;border-radius:50%;border:3px solid var(--ink)}
.otext{flex:none;font-weight:900;font-size:15px;opacity:.7;padding:0 6px;white-space:normal;max-width:min(460px,80vw);line-height:1.25}
@media (max-width:600px){.tool{min-width:58px;font-size:12px}.tool .ti{font-size:24px}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3vw,32px);text-align:center;padding:20px}
.puzhud{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.plv{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px}
.pbtn{border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:8px 18px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--ink)}
.pbtn.go{background:var(--leaf);font-size:22px}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stage:has(.simwrap){background:var(--paper)}
.discbtn{position:absolute;left:12px;top:12px;z-index:5;border:3px solid var(--ink);border-radius:999px;background:var(--paper);padding:6px 14px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.discbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.discpanel{position:absolute;left:12px;top:64px;z-index:6;background:var(--paper);border:var(--edge);border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 var(--ink);max-width:min(440px,calc(100% - 24px));max-height:calc(100% - 80px);overflow:auto}
.discpanel h3{margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:26px}
.discpanel ul{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.discpanel li{font-weight:800;font-size:16px;opacity:.65}
.discpanel li.got{opacity:1;color:var(--ink)}
.pdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink)}

@media (max-width:520px){.age{font-size:12px;padding:1px 7px;top:10px;right:10px}.tile p{font-size:13px}}

/* ---------- math labs ---------- */
.lab{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.lab-top{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:var(--edge);background:var(--paper)}
.lab-top::-webkit-scrollbar{display:none}
.lab-main{flex:1;min-height:0;display:flex}
.lab-main .simarea{min-width:0;flex:1}
.fx{border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:8px 12px;font-family:var(--font-math);font-size:clamp(17px,1.7vw,21px);line-height:1.5;box-shadow:0 3px 0 var(--ink)}

.lh{display:flex;gap:4px}
.lb{flex:1;border:3px solid var(--ink);border-radius:10px;background:var(--leaf);color:#fff;font-weight:900;font-size:17px;padding:4px 10px;white-space:nowrap}

.cb.loop .lbody{background:#fff;border:3px dashed rgba(36,199,134,.6);min-height:46px}
.drop{font-weight:800;font-size:13px;opacity:.5;align-self:center;padding:0 4px}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.pb2{width:64px;height:64px;border:4px solid var(--ink);border-radius:16px;background:var(--sun);font-size:32px;box-shadow:0 5px 0 var(--ink);padding:0}
.pb2.wide{width:auto;padding:0 14px;font-size:20px;font-weight:900;background:var(--leaf);color:#fff}
.pb2:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pzl{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding:16px;background:radial-gradient(circle at 50% 30%,#F1ECFF,#FDFBF4 70%)}
.hanoi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,24px);width:min(100%,820px);height:min(70%,420px);min-height:240px}
.peg{position:relative;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:4px;padding:0 0 14px;border:0;border-bottom:10px solid #7A5A3A;border-radius:12px;background:rgba(122,90,58,.08)}
.peg.from{background:rgba(255,200,61,.25)}
.pole{position:absolute;bottom:0;top:12%;left:50%;width:12px;margin-left:-6px;background:#C98B4F;border-radius:6px 6px 0 0;border:3px solid var(--ink);z-index:0}
.disk{position:relative;z-index:1;width:var(--w);height:clamp(22px,4.2vh,36px);border:3px solid var(--ink);border-radius:999px;background:var(--c);font-weight:900;font-size:15px;display:grid;place-items:center;transition:transform .15s}
.disk.lift{transform:translateY(-26px)}
.lgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(6px,1.4vw,12px);width:min(92%,62vh,460px)}
.lamp{aspect-ratio:1;border:4px solid var(--ink);border-radius:18px;background:#3B3770;box-shadow:0 5px 0 var(--ink);transition:background .15s}
.lamp.on{background:radial-gradient(circle at 40% 35%,#FFF7C2,#FFC83D 60%,#FF8A2B);box-shadow:0 5px 0 var(--ink),0 0 26px rgba(255,200,61,.8)}
.lamp:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bintarget{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4vw,44px)}
.bintarget b{color:var(--berry);font-size:1.3em}
.bintarget.sm{font-size:clamp(20px,2.6vw,30px)}
.bins{display:flex;gap:clamp(4px,1vw,12px);flex-wrap:wrap;justify-content:center}
.bit{width:clamp(56px,9vw,92px);display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.bit .bv{font-weight:900;font-size:clamp(14px,1.8vw,19px)}
.bit .bb{width:100%;aspect-ratio:3/4;border:4px solid var(--ink);border-radius:50% 50% 18px 18px;background:#3B3770;color:#fff;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4vw,44px);display:grid;place-items:center;box-shadow:0 5px 0 var(--ink)}
.bit.on .bb{background:radial-gradient(circle at 40% 30%,#FFF7C2,#FFC83D 60%);color:var(--ink);box-shadow:0 5px 0 var(--ink),0 0 24px rgba(255,200,61,.8)}
.sgrid{display:grid;grid-template-columns:repeat(var(--n),1fr);width:min(92%,46vh,440px);border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--paper)}
.sc{aspect-ratio:1;border:0;border-right:1.5px solid rgba(29,24,66,.25);border-bottom:1.5px solid rgba(29,24,66,.25);background:var(--paper);font-family:var(--font-display);font-weight:800;font-size:clamp(22px,4vw,40px);color:var(--c,var(--ink));padding:0}
.sc.fx2{background:#EEF2FF;color:var(--ink)}
.sc.br{border-right:4px solid var(--ink)}.sc.bb{border-bottom:4px solid var(--ink)}
.sc.sel{background:#FFF3C4;box-shadow:inset 0 0 0 4px var(--sun)}
.sc.bad{background:#FFD9DF}
.spad{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sp{width:58px;height:58px;border:4px solid var(--ink);border-radius:16px;background:var(--c,var(--paper));font-family:var(--font-display);font-weight:800;font-size:28px;box-shadow:0 4px 0 var(--ink);padding:0}
.sp:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* floating formula card on the original labs */
.lab-top .pbar{flex-wrap:nowrap;flex:none}.lab-top>*{flex:none}

/* ---------- touch safety + target sizes ---------- */
html,body{overscroll-behavior:none;touch-action:pan-x pan-y}
button,a,.rng{touch-action:manipulation}
img,canvas{-webkit-user-drag:none}
.opt,.pbtn,.tool,.jump,.chip{min-height:44px}
.pbtn.small{min-height:44px}
.snd2{width:52px;height:52px;font-size:24px}
.tile:focus-visible,.opt:focus-visible,.pbtn:focus-visible,.tool:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
@media (max-width:600px){.back{width:52px;height:52px;font-size:28px}.gbar{gap:8px}.gbar .pill{padding:4px 10px;font-size:18px}}
.stage:focus{outline:none}
.dots .ga{border-color:var(--ink)}.dots .ga.f{background:var(--berry)}.dots .gb.f{background:var(--sky)}
.dots .plus{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:26px;padding:0 4px}
.piece:focus-visible,.hole:focus-visible{outline:4px solid var(--sun);outline-offset:4px;border-radius:16px}
.piece.held{filter:drop-shadow(0 0 0 var(--sun)) drop-shadow(0 8px 6px rgba(29,24,66,.35));transform:scale(1.12)}
.wig{animation:wig2 .45s}
@keyframes wig2{25%{transform:rotate(-8deg) scale(1.08)}75%{transform:rotate(8deg) scale(1.08)}}
.kcur{position:absolute;z-index:7;width:34px;height:34px;margin:-17px 0 0 -17px;border:4px solid var(--ink);border-radius:50%;background:rgba(255,200,61,.35);box-shadow:0 0 0 3px #fff;pointer-events:none;transition:transform .08s}
.kcur::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--ink)}
.kcur.down{transform:scale(.75);background:rgba(255,79,123,.55)}
@media (max-width:900px){.tools{flex-wrap:wrap;justify-content:center;overflow:visible}}
.pot.typing{box-shadow:0 0 0 3px var(--paper),0 0 0 7px var(--sky)}
.pulse{animation:pulseBtn 1s infinite;background:var(--leaf)!important;color:#fff}
@keyframes pulseBtn{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ---------- pop-up menus ---------- */
.pop{position:absolute;z-index:40;background:var(--paper);border:var(--edge);border-radius:22px;box-shadow:0 8px 0 var(--ink),0 18px 40px rgba(29,24,66,.35);padding:10px;max-width:min(560px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;animation:popIn .14s ease-out}
@keyframes popIn{from{transform:scale(.92);opacity:0}}
.popgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;min-width:min(480px,80vw)}
.popitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;min-height:76px;border:3px solid var(--ink);border-radius:16px;background:var(--cloud);font-weight:900;font-size:14px;line-height:1.1;text-align:center}
.popitem .pe{font-size:32px;line-height:1.1}
.popitem.on{background:var(--sun)}
.popitem:active{transform:translateY(2px)}
.popitem:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.caret{font-size:12px;margin-top:-2px;opacity:.7}
.tool.popon{background:var(--sun)}
.tool.dim{opacity:.35}
/* toolbars wrap: nothing ever hides off the edge */
.drow.wrap,.dock .drow,.lab-top{flex-wrap:wrap;overflow:visible}
.lab-top .pbar{flex-wrap:wrap}
.dock .drow{justify-content:flex-start}
.cdot{flex:none;width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);background:var(--c);padding:0}
.cdot.on{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink);transform:scale(1.05)}
.els .opt{padding:2px 10px 2px 4px;min-height:40px;font-size:14px}
.pdot2{display:inline-block;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink)}
#jump{position:sticky;top:0;z-index:5;background:var(--sky);padding:10px 0;border-radius:0 0 18px 18px}
.jump{cursor:pointer;font-family:inherit}
.jump.on{background:var(--ink);color:var(--paper)}

/* ---------- bottom info tabs (one card at a time, never scrolls) ---------- */
.idock{flex:none;display:flex;flex-direction:column;background:#FFFCF2;border-top:var(--edge);min-width:0}
.idock.empty{display:none}
.itabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px 0;background:var(--cloud);border-bottom:3px solid var(--ink)}
.itab{position:relative;bottom:-3px;border:3px solid var(--ink);border-radius:14px 14px 0 0;background:#DCE3FF;color:var(--ink);font-family:var(--font-body);font-weight:900;font-size:15px;
  padding:6px 14px;min-height:42px;white-space:nowrap;max-width:min(260px,44vw);overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.itab.on{background:#FFFCF2;border-bottom-color:#FFFCF2;z-index:1}
.itab.hot::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#FF8A2B;margin-right:7px;vertical-align:1px}
.idock.closed .itabs{border-bottom:0;padding-bottom:8px}.idock.closed .itab{bottom:0;border-radius:14px}
.idock.closed .lab-panel,.idock.closed .fxo-b{display:none}
.lab-panel{display:flex;gap:16px;align-items:flex-start;padding:10px 16px 12px;min-width:0;overflow:hidden}
.lab-panel .fx,.fxo-b .fx{display:none}
.lab-panel>:not(.fx):not(.keep):not(:has(.fx)){display:none}
.idock .fx.ion{display:block;flex:1;min-width:0;border:0;box-shadow:none;background:transparent;padding:0 4px;font-size:clamp(18px,1.9vw,24px);
  column-width:300px;column-gap:28px;column-rule:2px dashed rgba(29,24,66,.12)}
.idock .fx.ion>*{break-inside:avoid}
.idock .fx.ion .tag{display:none}
.idock .fx.ion .txt{font-size:clamp(15px,1.5vw,18px)}
.lab-panel .keep{flex:none;max-width:60%}
.lab-panel .keep .fx,.lab-panel .keep.fx{display:block}
/* sandbox games: the same tabs sit along the bottom of the play area, see-through so the game shows behind */
.fxo{position:absolute;left:0;right:0;bottom:0;z-index:5;background:transparent;border-top:0;pointer-events:none}
.fxo .itabs{pointer-events:auto;background:transparent;border-bottom:0;padding:0 10px}
.fxo .itab{bottom:0;border-radius:14px 14px 0 0;background:rgba(220,227,255,.95)}
.fxo .itab.on{background:rgba(255,255,255,.95);border-bottom-color:transparent}
.fxo.closed .itab{border-radius:14px 14px 0 0}
.fxo-b{background:rgba(255,255,255,.93);border-top:3px solid var(--ink);padding:8px 16px 10px}
@media (max-width:600px){.itab{font-size:13px;padding:5px 10px;min-height:38px}.idock .fx.ion{font-size:17px;column-width:240px}.lab-panel{padding:8px 10px}}
.rkeep{display:flex;flex-direction:column;gap:8px;max-width:none!important;flex:1!important}
.rkeep .fx{font-size:16px;padding:6px 10px}
.rkeep .code{max-height:min(30vh,240px);overflow:auto;overscroll-behavior:contain}
.hbar{display:inline-flex;gap:4px;flex-wrap:wrap}.hbar .pbtn{min-width:52px}
.rkeep{flex-direction:row!important;align-items:stretch}
.rkeep .pal{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;max-width:46%}
.rkeep>.fx{flex:1;min-width:0}
.inav,.icount{display:none}
@media (max-width:600px){
  .itabs{flex-wrap:nowrap;align-items:flex-end}
  .itabs .itab{display:none}
  .itabs .itab.cur{display:block;flex:1;max-width:none;text-align:center}
  .itab .icount{display:inline;margin-left:8px;opacity:.5;font-size:12px}
  .inav{display:block;flex:none;width:44px;min-height:38px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-size:14px;margin-bottom:5px;color:var(--ink)}
  .idock.closed .inav{margin-bottom:0}
  .itabs.one .inav{visibility:hidden}

<script>
(()=>{

const $=s=>document.querySelector(s);
const GAMES={};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const inRect=(x,y,el,pad=0)=>{const r=el.getBoundingClientRect();return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad};
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};

/* ---------- sound + voice ---------- */
let soundOn=true, actx=null;
try{ if(localStorage.getItem('wb-sound')==='off') soundOn=false }catch(e){}
function audio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(actx.state==='suspended') actx.resume();
  return actx;
}
document.addEventListener('pointerdown',audio,{capture:true});
document.addEventListener('contextmenu',e=>e.preventDefault());
let master=null,voices=0;const lastHit=new Map();
/* Master chain: gentle lowpass -> soft compressor -> quiet room reverb -> output. Keeps everything warm, never shrill. */
function out(){const a=audio();if(!a)return null;if(!master){
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.5;
  const comp=a.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
  const vol=a.createGain();vol.gain.value=.55;
  const len=Math.floor(a.sampleRate*.9),ir=a.createBuffer(2,len,a.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}

/* Skip a sound if the same kind of sound just played (stops machine-gun clicks when many things collide at once). */
function tooSoon(key,ms){const now=performance.now(),l=lastHit.get(key)||0;if(now-l<ms)return true;lastHit.set(key,now);if(lastHit.size>300)lastHit.clear();return false}
function tone(f,d=.18,type='sine',vol=.2,when=0,f2){
  if(!soundOn||voices>24) return; const a=audio(); if(!a) return;
  if(when<.01&&tooSoon('t'+Math.round(Math.log2(Math.max(20,f))*12),35)) return;

  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d);

}
let noiseBuf=null;
function noise(d=.2,f=1200,q=1,vol=.2,when=0,f2,type='bandpass'){
  if(!soundOn||voices>24) return; const a=audio(); if(!a) return;
  if(when<.01&&tooSoon('n'+Math.round(Math.log2(Math.max(20,f))*4),45)) return;

  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(bq).connect(g).connect(out());voices++;s.onended=()=>voices--;s.start(t,Math.random()*.5);s.stop(t+d+.05);
}
const pop=(p=1)=>{tone(620*p,.1,'sine',.2,0,260*p);tone(1240*p,.05,'sine',.05)};
const cheer=()=>[523,659,784,1047].forEach((f,i)=>{tone(f,.35,'sine',.13,i*.085);tone(f*2,.2,'triangle',.03,i*.085)});

/* Spoken words are switched off for now. Flip VOICE to true to bring every game's narration back. */
const VOICE=false;

}

const soundHooks=new Set();

const sndBtn=$('#snd'),sndBtn2=$('#snd2');
function paintSnd(){sndBtn.textContent=soundOn?'🔊 Sound on':'🔇 Sound off';sndBtn.setAttribute('aria-pressed',soundOn);sndBtn2.textContent=soundOn?'🔊':'🔇';sndBtn2.setAttribute('aria-pressed',soundOn);sndBtn2.setAttribute('aria-label',soundOn?'Sound on':'Sound off')}

sndBtn2.addEventListener('click',()=>sndBtn.click());
sndBtn.addEventListener('click',()=>{soundOn=!soundOn;paintSnd();try{localStorage.setItem('wb-sound',soundOn?'on':'off')}catch(e){};if(soundOn){tone(660,.15,'triangle');say('Sound on!')}else{try{speechSynthesis.cancel()}catch(e){}}
  soundHooks.forEach(f=>{try{f(soundOn)}catch(e){}})});

/* ---------- stars ---------- */
let stars=0;
try{stars=Math.max(0,parseInt(localStorage.getItem('wb-stars')||'0',10)||0)}catch(e){}
function drawStars(b){document.querySelectorAll('.starn').forEach(n=>{n.textContent=stars;if(b){const p=n.parentElement;p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')}})}

drawStars();

/* ---------- confetti ---------- */
const fx=$('#fx'), fctx=fx.getContext('2d'); let parts=[], fxOn=false;
const CONF=['#FF4F7B','#FFC83D','#24C786','#3E67F0','#9A5BFF','#FF8A2B','#18BFD6'];
function sizeFx(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
sizeFx(); addEventListener('resize',sizeFx);
function burst(x,y,n=40,cols=CONF,spd=9){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*spd;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(cols),s:6+Math.random()*8,l:1,shape:Math.random()<.5})}

}
function party(){for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(.1+.2*i),innerHeight*.45,45),i*90)}
function fxLoop(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l>0);
  for(const p of parts){p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.012;
    fctx.save();fctx.globalAlpha=Math.max(p.l,0);fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.fillStyle=p.c;
    if(p.shape){fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}else{fctx.beginPath();fctx.arc(0,0,p.s/2.4,0,7);fctx.fill()}fctx.restore()}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fctx.clearRect(0,0,innerWidth,innerHeight)}
}
function floaty(stage,x,y,html){const r=stage.getBoundingClientRect();const d=document.createElement('div');d.className='floaty';d.innerHTML=html;
  d.style.maxWidth=(r.width-16)+'px';d.style.top=Math.max(y-r.top,70)+'px';d.style.left='0px';stage.appendChild(d);
  const hw=d.offsetWidth/2;d.style.left=Math.min(Math.max(x-r.left,hw+8),r.width-hw-8)+'px';setTimeout(()=>d.remove(),1650)}

/* ---------- drag helper (tap or drag) ---------- */
function draggable(el,o){
  el.addEventListener('pointerdown',e=>{
    if(o.enabled&&!o.enabled())return;if(el.classList.contains('dragging'))return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,id=e.pointerId;let moved=false,ended=false,lx=sx,ly=sy;
    try{el.setPointerCapture(id)}catch(_){}
    el.classList.remove('return');el.classList.add('dragging');o.onStart&&o.onStart();
    const mv=ev=>{if(ev.pointerId!==id)return;const dx=ev.clientX-sx,dy=ev.clientY-sy;lx=ev.clientX;ly=ev.clientY;if(Math.hypot(dx,dy)>12)moved=true;
      if(moved){el.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`;o.onMove&&o.onMove(ev.clientX,ev.clientY)}};
    /* runs once per press: pointerup is followed by lostpointercapture, and both used to fire this (double taps, double drops) */
    const up=ev=>{if(ev.pointerId!==id||ended)return;ended=true;
      for(const t of ['pointermove','pointerup','pointercancel','lostpointercapture'])el.removeEventListener(t,t==='pointermove'?mv:up);

/* ---------- canvas + pointer helpers ---------- */
function fitCanvas(cv){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));

/* tracks every finger on an element: down/move/up with position + velocity (px per frame) */
function fingers(el,h){
  const map=new Map();
  const loc=e=>{const r=el.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=loc(e);
    const f={id:e.pointerId,x,y,sx:x,sy:y,vx:0,vy:0,t:performance.now(),data:{}};map.set(e.pointerId,f);h.down&&h.down(f,e)});

function twoFinger(map){const fs=[...map.values()];if(fs.length<2){twoFinger.prev=null;return null}const[a,b]=fs,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,d=Math.hypot(b.x-a.x,b.y-a.y)||1,an=Math.atan2(b.y-a.y,b.x-a.x);

/* ---------- math lab helpers ---------- */
const fmt=(v,d=1)=>{if(!isFinite(v))return '∞';const r=Math.round(v*10**d)/10**d;return (Object.is(r,-0)?0:r).toLocaleString('en-US',{maximumFractionDigits:d})};

/* canvas on the left, live formula panel on the right (stacks on phones) */
function labShell(stage,{top='',panel='',label='Play area'}={}){

    <div class="idock"><div class="itabs" role="tablist"></div><aside class="lab-panel">${panel}</aside></div></div>`;

/* Toolbars always fit on one row. If a bar would wrap, it first folds each group of choices (modes, sizes, tools) into one

   The original buttons stay in the page, hidden, and get clicked for real, so every game's own code keeps working. */
function compactBar(bar){let busy=false;
  const key=b=>{for(const a of b.attributes)if(a.name.startsWith('data-')&&a.name!=='data-cg')return a.name;return null};
  const shown=x=>!x.classList.contains('cgh')&&!x.hidden&&x.style.display!=='none'&&getComputedStyle(x).display!=='none';
  const wraps=()=>{const kids=[...bar.querySelectorAll(':scope>*, :scope>.pbar>*')].filter(x=>!x.classList.contains('pbar')&&shown(x)&&x.offsetHeight);if(!kids.length)return false;
    const t0=Math.min(...kids.map(k=>k.getBoundingClientRect().top));return kids.some(k=>k.getBoundingClientRect().top>t0+12)};

  function refresh(){if(busy||!bar.isConnected)return;busy=true;mo.disconnect();
    bar.querySelectorAll('.cgbtn').forEach(x=>x.remove());bar.querySelectorAll('.cgh').forEach(x=>x.classList.remove('cgh'));

        if(grp.length>=2&&grp.some(x=>x.classList.contains('on')))groups.push(grp)}

Object.assign(GAMES,{fireworks:{title:'Firework Sky',icon:'🎆',c:'var(--berry)',age:'2+',order:2,blurb:'Tap for colors, shapes and counting fireworks',
init(stage,g){
  const COLS=[['red','#FF4F5E'],['orange','#FF9A3D'],['yellow','#FFD93D'],['green','#3FE07A'],['blue','#4F8BFF'],['purple','#B278FF'],['pink','#FF7FC8']];

    <span class="otext">Tap the sky! Drag your finger for sparkles.</span></div></div></div>`;

    stars=[];for(let i=0;i<Math.round(W*H/5000);i++)stars.push([Math.random()*W,Math.random()*H*.7,Math.random()*6])}

  function shapePts(kind,n){const pts=[];
    const edge=(vs)=>{const per=[];let L=0;for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);per.push([a,b,l]);L+=l}
      for(let k=0;k<n;k++){let t=k/n*L;for(const [a,b,l] of per){if(t<=l){pts.push([a[0]+(b[0]-a[0])*t/l,a[1]+(b[1]-a[1])*t/l]);break}t-=l}}};
    if(kind==='circle')for(let k=0;k<n;k++){const a=k/n*6.283;pts.push([Math.cos(a),Math.sin(a)])}

    if(kind==='triangle')edge([[0,-.95],[.9,.7],[-.9,.7]]);

      for(let k=0;k<5;k++){pts.push([-.35+Math.cos(k*1.25)*.07,-.3+Math.sin(k*1.25)*.07]);pts.push([.35+Math.cos(k*1.25)*.07,-.3+Math.sin(k*1.25)*.07])}}

const MATTER_URL='matter.min.js';
/* Loads the physics engine once. If a load failed (offline before the app was cached), the next attempt really
   retries instead of waiting forever on the dead script tag. */
function loadMatter(ok,fail){
  if(window.Matter)return ok();
  let s=document.querySelector('script[data-matter]');
  if(s&&s.dataset.failed){s.remove();s=null}
  if(!s){s=document.createElement('script');s.src=MATTER_URL;s.dataset.matter='1';s.addEventListener('error',()=>{s.dataset.failed='1'},{once:true});document.head.appendChild(s)}

}

  const hint=makeHint(hintEl);

  function ryb(r,y,b,o,i){const m=Math.max(r,y,b,1e-4);r/=m;y/=m;b/=m;const ir=1-r,iy=1-y,ib=1-b;
    for(let c=0;c<3;c++){const v=C.w[c]*ir*iy*ib+C.r[c]*r*iy*ib+C.y[c]*ir*y*ib+C.b[c]*ir*iy*b+C.o[c]*r*y*ib+C.p[c]*r*iy*b+C.gr[c]*ir*y*b+C.k[c]*r*y*b;o[c][i]=v*255}}
  const outs=[prR,prG,prB];

  /* ---------- background ---------- */
  const bg=document.createElement('canvas');
  function drawBg(){bg.width=cv.width;bg.height=cv.height;const b=bg.getContext('2d'),d=dims.d;b.setTransform(d,0,0,d,0,0);
    const gr=b.createLinearGradient(0,0,0,dims.h);gr.addColorStop(0,'#F4FBFF');gr.addColorStop(1,'#D7EEF8');b.fillStyle=gr;b.fillRect(0,0,dims.w,dims.h);

    for(let x=t;x<dims.w;x+=t){b.beginPath();b.moveTo(x,0);b.lineTo(x,dims.h);b.stroke()}
    for(let y=dims.h-t;y>0;y-=t){b.beginPath();b.moveTo(0,y);b.lineTo(dims.w,y);b.stroke()}
    b.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<14;i++){b.beginPath();b.arc((i*137)%dims.w,(i*89)%dims.h,3,0,7);b.fill()}}
  drawBg();

  /* ---------- metaball field ---------- */
  let fs,fw,fh,FD,FR,FG,FB,FF,img,fcv,fctx,K,KR,SURF;
  function setupField(){
    fs=clamp(Math.round(Math.sqrt(dims.w*dims.h/70000)),3,6);fw=Math.ceil(dims.w/fs)+1;fh=Math.ceil(dims.h/fs)+1;
    FD=new Float32Array(fw*fh);FR=new Float32Array(fw*fh);FG=new Float32Array(fw*fh);FB=new Float32Array(fw*fh);FF=new Float32Array(fw*fh);
    SURF=new Int16Array(fw);fcv=document.createElement('canvas');fcv.width=fw;fcv.height=fh;fctx=fcv.getContext('2d');img=fctx.createImageData(fw,fh);
    KR=Math.max(2,Math.round(0.85*S/fs));const n=2*KR+1;K=new Float32Array(n*n);
    for(let y=-KR;y<=KR;y++)for(let x=-KR;x<=KR;x++){const q=(x*x+y*y)/(KR*KR);K[(y+KR)*n+x+KR]=q<1?(1-q)*(1-q):0}
  }
  setupField();
  function renderWater(){
    FD.fill(0);FR.fill(0);FG.fill(0);FB.fill(0);FF.fill(0);
    const n=sim.n,x=sim.x,y=sim.y,vx=sim.vx,vy=sim.vy,kn=2*KR+1,sc=S/fs;
    for(let i=0;i<n;i++)ryb(sim.cr[i],sim.cyl[i],sim.cb[i],outs,i);
    for(let i=0;i<n;i++){
      const cx=Math.round(x[i]*sc),cy=Math.round(y[i]*sc),r=prR[i],gg=prG[i],b=prB[i];
      const sp=Math.min(1,(Math.abs(vx[i])+Math.abs(vy[i]))*4);
      const y0=Math.max(-KR,-cy),y1=Math.min(KR,fh-1-cy),x0=Math.max(-KR,-cx),x1=Math.min(KR,fw-1-cx);
      for(let ky=y0;ky<=y1;ky++){let p=(cy+ky)*fw+cx+x0,k=(ky+KR)*kn+x0+KR;
        for(let kx=x0;kx<=x1;kx++,p++,k++){const w=K[k];if(w>0){FD[p]+=w;FR[p]+=r*w;FG[p]+=gg*w;FB[p]+=b*w;FF[p]+=sp*w}}}
    }
    const D=img.data,T=0.38,surf=SURF,ph=frame*.05,dpx=fs/S;
    for(let xx=0;xx<fw;xx++)surf[xx]=-1;
    for(let yy=0,p=0;yy<fh;yy++){for(let xx=0;xx<fw;xx++,p++){const d=FD[p],o=p*4;
      if(d<T){D[o+3]=0;surf[xx]=-1;continue}
      if(surf[xx]<0)surf[xx]=yy;
      const below=(yy-surf[xx])*dpx;                          // sim units under this column's surface
      const inv=1/d;let r=FR[p]*inv,gg=FG[p]*inv,b=FB[p]*inv;
      const edge=1-Math.min(1,(d-T)/0.8);
      const foam=Math.min(1,FF[p]*inv*1.3);
      const rim=below<0.55?1-below/0.55:0;                     // bright surface line
      const wave=below>1.2?Math.sin(xx*.11+ph+Math.sin(yy*.09-ph*.7)*2.2)*Math.sin(yy*.07+ph*.6+Math.sin(xx*.05)*1.5):0;
      const lift=Math.min(.8,edge*.12+rim*.5+foam*.3+(wave>.55?(wave-.55)*.5:0));
      const deep=Math.min(.4,.06+below*.014);
      r=(r+(255-r)*lift)*(1-deep);gg=(gg+(255-gg)*lift)*(1-deep*.8);b=(b+(255-b)*lift)*(1-deep*.35);

    }}

  }

  /* ---------- toys ---------- */
  function addToy(t,x,y){

  }
  function toyAt(x,y){for(let i=sim.bodies.length-1;i>=0;i--){const b=sim.bodies[i];if(Math.hypot(b.x-x,b.y-y)<b.r*1.35)return b}return null}

  /* ---------- particles in / out ---------- */

    const c=PAINT[ci][2];if(!exact){x+=(Math.random()-.5)*.5;y+=(Math.random()-.5)*.5}sim.add(x,y,vx,vy,c[0],c[1],c[2]);
  }
  /* nozzle: lays rows of particles at rest spacing so water leaves as a smooth stream */
  const SP=.46;
  function emit(e,x,y,dx,dy,speed,width,ci){

    while(e.acc>=SP&&rows<4){e.acc-=SP;rows++;

      for(let j=0;j<k;j++){const o=(j-(k-1)/2)*SP+(Math.random()-.5)*.06;spawn(x+nx*o-ux*e.acc,y+ny*o-uy*e.acc,ux*speed,uy*speed,ci,true)}}
  }
  function fillRect(x0,y0,x1,y1,ci){const c=PAINT[ci][2];for(let y=y1-.3;y>y0;y-=.47)for(let x=x0+.3;x<x1;x+=.47){if(sim.n>=sim.cap)return;sim.add(x+Math.random()*.05,y,0,0,c[0],c[1],c[2])}}
  function wallLine(pts){for(let i=1;i<pts.length;i++)sim.addWall(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])}

  }

  /* ---------- color-mix detective ---------- */
  const MIXES=[['gr','y','b','Blue and yellow make green!','🟦 + 🟨 = 🟩'],['o','r','y','Red and yellow make orange!','🟥 + 🟨 = 🟧'],['p','r','b','Red and blue make purple!','🟥 + 🟦 = 🟪'],['k','r','y','All three colors make brown!','🟥 + 🟨 + 🟦 = 🟫']];
  function checkMix(){
    let cnt={gr:0,o:0,p:0,k:0},sx={gr:0,o:0,p:0,k:0},sy={gr:0,o:0,p:0,k:0};
    for(let i=0;i<sim.n;i+=2){const r=sim.cr[i],y=sim.cyl[i],b=sim.cb[i],m=Math.max(r,y,b);if(m<=0)continue;const R=r/m,Y=y/m,B=b/m;
      let k=null;if(R>.45&&Y>.45&&B>.45)k='k';else if(Y>.45&&B>.45&&R<.25)k='gr';else if(R>.45&&Y>.45&&B<.25)k='o';else if(R>.45&&B>.45&&Y<.25)k='p';

      floaty(stage,r.left+sx[k]/cnt[k]*S,r.top+sy[k]/cnt[k]*S-40,m[4]);tone(660,.15,'triangle');tone(990,.25,'triangle',.18,.12);addStar();break}}
  }

  /* ---------- input ---------- */
  const fingersMap=fingers(cv,{
    down(f){const x=f.x/S,y=f.y/S;const b=toyAt(x,y);
      if(b&&tool!=='sponge'){if(b.held)return;f.data.toy=b;b.held=true;b.tx=x;b.ty=y;focus=b;tone(500,.08,'triangle');return}
      if(tool==='toys'){const t=TOYS[toyPick];addToy(t,x,y);pop(.9);say(t.n);return}

    },
    move(f){const b=f.data.toy;if(b)return;

  /* ---------- tools UI ---------- */
  const TIP={pour:'Touch and drag to pour water. Pick a color first!',push:'Swish the water around with your finger. You can grab toys too!',wall:'Draw walls, cups and ramps with your finger.',
    sponge:'Rub to soak up water and wipe away walls.',toys:'Tap the water to drop a toy in.',spring:'Tap the bottom for a fountain, the top for a faucet.',drain:'Tap to make a drain hole. Tap it again to close it.'};
  function syncTools(){stage.querySelectorAll('.tool[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));stage.querySelectorAll('.cdot').forEach(b=>b.classList.toggle('on',+b.dataset.p===paint));
    const tb=stage.querySelector('.tool[data-t="toys"] .ti');if(tb)tb.textContent=TOYS[toyPick].e}

  syncTools();

  /* ---------- per-frame ---------- */
  let frame=0,pourTick=0,soundTick=0,perf=0;
  function update(){
    const W=sim.W,H=sim.H;sim.pushers.length=0;
    let pouring=false;
    for(const f of fingersMap.values()){const x=f.x/S,y=f.y/S;
      if(f.data.toy){const b=f.data.toy;b.tx=x;b.ty=y;continue}
      if(tool==='push')sim.pushers.push({x,y,vx:f.vx/S/SUB,vy:f.vy/S/SUB,r:1.7});

        if(b.wetF>4){b.gscale=.0;const T=b.target;const dx=T.x-b.x,dy=T.y-b.y,dd=Math.hypot(dx,dy);

    }

  }
  function draw(){
    ctx.setTransform(dims.d,0,0,dims.d,0,0);ctx.drawImage(bg,0,0,dims.w,dims.h);

    for(const d of sim.drains){const x=d.x*S,y=d.y*S,r=d.r*S;ctx.fillStyle='#1D1842';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.strokeStyle='#7E8BB8';ctx.lineWidth=3;for(let a=0;a<3;a++){ctx.beginPath();ctx.arc(x,y,r*.55,frame*.12+a*2.1,frame*.12+a*2.1+1.2);ctx.stroke()}}

        const R=sim.walls[0].r*S;ctx.lineWidth=pass===0?R*2+6:pass===1?R*2:R*.5;ctx.strokeStyle=pass===0?'#1D1842':pass===1?'#C2834A':'rgba(255,255,255,.28)';ctx.stroke()}}

      ctx.beginPath();ctx.arc(x,y,S*.75,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-S*.22,y-S*.22,S*.18,0,7);ctx.fill()}
    // finger cursors

/* One game session. Everything a game starts (timers, frames, listeners, observers, sounds) is registered here,
   so leaving the game stops all of it, even if the child taps Back before the game has finished starting. */
const STEP=1000/60;

  const timers=new Set(),ends=[],frames=new Set(),loops=new Set();

       (hidden tab, sleeping tablet) resumes without a jump. */

      const tick=t=>{if(!this.alive)return;let dt=t-L.last;L.last=t;if(dt<0||dt>250)dt=STEP;
        if(document.hidden)L.acc=0;else{L.acc+=dt;let n=0;while(L.acc>=STEP-1&&n<2){L.acc-=STEP;n++;fn(STEP,t)}if(L.acc>STEP)L.acc=0}

    onEnd(fn){if(!this.alive){try{fn()}catch(e){}return}ends.push(fn)},
